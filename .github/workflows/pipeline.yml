name: Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run lint
        
      - name: Type check
        run: npx tsc --noEmit
        
      - name: Run security audit
        run: npm audit --audit-level=high --omit=dev
        
      - name: Run tests
        run: npm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

# Deployment is handled by Vercel's Git integration, not by this workflow.
#
# History: this job originally used amondnet/vercel-action@v25, which pinned
# Vercel CLI 25.1.0 and began failing outright once the deploy endpoint
# required >= 47.2.2. Replacing it with the official CLI flow fixed everything
# up to the upload: `vercel pull` and `vercel build --prod` both succeed. The
# `vercel deploy --prebuilt` step then hung indefinitely pushing the build
# output from the runner to Vercel - 202 minutes on one attempt and 73+ on
# another, at well under 50 KB/s, with and without --archive=tgz. That is a
# stall rather than a bandwidth limit, and it did not resolve by shrinking the
# payload from 462MB to 214MB.
#
# Vercel's Git integration sidesteps it: Vercel clones the repository and
# builds it itself, so there is no runner upload to hang. It also provides
# per-PR preview deployments, which this workflow never did.
#
# This workflow now does what CI should do - lint, typecheck, audit, test and
# prove the build compiles. If you ever need to deploy from here again, use
# the official CLI steps rather than a third-party wrapper action.
